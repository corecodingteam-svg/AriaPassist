name: aria_admin
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  intl: any
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.18.3

  riverpod: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: any
  crypto: ^3.0.8

flutter:
  uses-material-design: true
  # Noto Sans, the Neon look's typeface (SIL Open Font License: assets/fonts/NotoSans-OFL.txt).
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-400.ttf
        - asset: assets/fonts/NotoSans-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-700.ttf
          weight: 700
