name: aria
description: "Aria — voice-first personal assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  aria_device:
    path: packages/aria_device
  connectivity_plus: ^7.3.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.3
  intl: any
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  uuid: ^4.6.0

  riverpod: any
  speech_to_text: ^7.5.0
  android_alarm_manager_plus: ^5.1.2
  crypto: ^3.0.8
  quick_actions: ^1.1.1
  local_auth: ^3.0.2
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  home_widget: ^0.10.0
  qr_flutter: ^4.1.0
  purchases_flutter: 10.18.1
  firebase_core: 5.1.0
  firebase_crashlytics: 6.0.1
  firebase_analytics: 13.0.1
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    # Noto Sans, the Neon look's typeface (SIL Open Font License: assets/fonts/NotoSans-OFL.txt).
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-400.ttf
        - asset: assets/fonts/NotoSans-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-700.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-800.ttf
          weight: 800
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-400.ttf
        - asset: assets/fonts/NotoSansDevanagari-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-700.ttf
          weight: 700
